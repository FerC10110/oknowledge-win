[project]
name = "oknowledge"
version = "0.1.0"
description = "Save a link, get a summarized note in your Obsidian vault"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "trafilatura>=2.0",
  "pypdf[crypto]>=5.1",
  "httpx>=0.28",
  "fastapi>=0.115",
  "uvicorn>=0.34",
  "jinja2>=3.1",
  "python-multipart>=0.0.20",
  "pyyaml>=6.0",
  "tomli-w>=1.1",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8.3",
    "reportlab>=4.2",
]

[project.scripts]
oknowledge = "oknowledge.cli:main"

[build-system]
requires = ["setuptools>=77"]      # PEP 639: license = "MIT" as an expression
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
oknowledge = ["prompts/*.txt", "web/templates/*.html", "web/static/*", "web/static/fonts/*"]
